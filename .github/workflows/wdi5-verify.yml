name: wdi5-verify
on: [push, workflow_dispatch]
jobs:
  wdi5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run test:wdi5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdi5-reports
          path: reports/
